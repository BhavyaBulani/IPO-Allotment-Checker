# Render Blueprint for the IPO Allotment Checker backend (FastAPI + Playwright + MySQL).
#
# Deploy via Render dashboard -> "New +" -> "Blueprint" (point it at this repo).
# This makes the backend reproducible: it installs Playwright's Chromium at
# build time and starts uvicorn on Render's injected $PORT.
#
# NOTE: If you already have a live service + database on Render and just want to
# reuse them, skip this blueprint and instead set the env vars below on the
# existing service (Settings -> Environment) and make sure its
# Build Command / Start Command match what's listed here.

services:
  - type: web
    name: ipo-checker-api          # becomes https://ipo-checker-api.onrender.com
    runtime: python
    plan: free
    rootDir: IPO_Checker/backend
    # NOTE: --with-deps is intentionally omitted. Render's native Python build
    # runs as a non-root user and `playwright install --with-deps` tries to `su
    # root` for apt-get, which fails with "su: Authentication failure". Render
    # already points PLAYWRIGHT_BROWSERS_PATH at a writable cache, so a plain
    # `playwright install chromium` downloads the browser without needing root.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && playwright install chromium
    startCommand: alembic upgrade head && python scripts/seed_registrars.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true        # random 64-char hex on first deploy
      - key: APP_PASSWORD
        generateValue: true        # random per service; never store a real/shared secret in git
        sync: false                # set manually; not overwritten on re-sync
      - key: CORS_ORIGINS
        value: https://ipoallotmentchecker.vercel.app
        sync: false
      # --- MySQL (managed database below) ---
      - key: MYSQL_HOST
        fromDatabase:
          name: ipo-checker-db
          property: host
      - key: MYSQL_PORT
        fromDatabase:
          name: ipo-checker-db
          property: port
      - key: MYSQL_USER
        fromDatabase:
          name: ipo-checker-db
          property: user
      - key: MYSQL_PASSWORD
        fromDatabase:
          name: ipo-checker-db
          property: password
      - key: MYSQL_DATABASE
        fromDatabase:
          name: ipo-checker-db
          property: database
      - key: MYSQL_SSL_MODE
        value: REQUIRED
      # Periodic DB ping so Aiven's free tier doesn't auto-power-off. Disable
      # ("0") once the database is on an always-on (paid) plan.
      - key: DB_KEEPALIVE_ENABLED
        value: "1"
      # --- Live registrar automation ---
      - key: LIVE_REGISTRAR_HEADLESS
        value: "1"
      - key: LIVE_NAV_TIMEOUT_MS
        value: "30000"
      - key: LIVE_ACTION_TIMEOUT_MS
        value: "15000"
      # Registrar dropdown discovery (Playwright) — the daily in-app scan in
      # main.py that detects which IPOs have live allotment results. Set "1"
      # to enable it (recommended). It runs once shortly after startup and
      # then every 24h, kept alive by the service's keep-alive pings. No
      # separate Render cron service is required.
      - key: ENABLE_REGISTRAR_DROPDOWN_DISCOVERY
        value: "1"
      - key: REGISTRAR_DROPDOWN_HEADLESS
        value: "1"
      # --- Additional IPO sources ---
      - key: IPOT_SUPABASE_URL
        value: https://zdzwtiwerwtzzhclvhdo.supabase.co
        sync: false
      - key: IPOT_ANON_KEY
        sync: false
      - key: IPOT_EMAIL
        sync: false
      - key: IPOT_PASSWORD
        sync: false
      - key: FINAPI_BASE_URL
        value: https://finapi.upvaly.com
        sync: false
      - key: FINAPI_API_KEY
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: TWOCAPTCHA_API_KEY
        sync: false
      - key: CAPTCHA_AUTO_SOLVER
        value: "0"

databases:
  - name: ipo-checker-db
    plan: free                   # Render MySQL may require a paid plan; reuse an
    databaseName: ipo_checker    # existing DB instead by setting MYSQL_* directly.
    user: ipo_user
