name: Keep backend awake

# Free-tier services sleep from inactivity:
#   - Render backend sleeps after ~15 min with no HTTP traffic.
#   - Aiven MySQL (free tier) powers off after ~2 h with no traffic.
# This workflow pings the Render /health endpoint on a cadence shorter than
# Render's sleep window. The backend's own in-app DB keep-alive loop then pings
# MySQL, so the two layers together keep the whole stack warm without a paid
# plan. This is a stopgap: upgrade the database to an always-on plan for real
# production traffic.

on:
  schedule:
    # Every 10 minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            https://ipo-allotment-checker.onrender.com/health

  # Note: GitHub disables scheduled workflows in a repository after 60 days
  # with no commits. If this ever stops keeping the site warm, push any commit
  # to the repo to re-enable the schedule.
